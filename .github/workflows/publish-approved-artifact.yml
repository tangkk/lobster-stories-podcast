name: Publish Approved Artifact

on:
  push:
    branches: [main]
    paths:
      - 'publish/requests/**.json'
      - '!publish/requests/replace-*.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-stories
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install runtime dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          python -m pip install --upgrade pip boto3
      - name: Resolve publish request
        id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^publish/requests/(?!replace-).+\.json$' -P | head -n 1)
          test -n "$REQUEST" || { echo 'No new-episode publish request'; exit 1; }
          for key in run_id artifact_name audio_filename audio_sha256 slug title description article_url prefix; do
            value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value" || exit 1
            echo "$key<<EOF" >> "$GITHUB_OUTPUT"; echo "$value" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"
          done
      - name: Validate pre-publish state
        env: {SLUG: "${{ steps.req.outputs.slug }}"}
        run: |
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_URL; do test -n "${!v}" || exit 1; done
          ! grep -q "<guid[^>]*>${SLUG}</guid>" feed.xml || exit 1
          NEXT=$(python -c 'import re,pathlib; s=pathlib.Path("feed.xml").read_text(); n=[int(x) for x in re.findall(r"<guid[^>]*>ep(\d+)-",s)]; print(max(n)+1 if n else 1)')
          REQ=$(python -c 'import re,sys; m=re.match(r"ep(\d+)-",sys.argv[1]); print(int(m.group(1)) if m else -1)' "$SLUG"); test "$REQ" = "$NEXT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.req.outputs.artifact_name }}
          path: approved
          repository: tangkk/lobster-stories-podcast
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate approved audio metadata
        id: meta
        env: {FILE: "${{ steps.req.outputs.audio_filename }}", EXPECTED_SHA: "${{ steps.req.outputs.audio_sha256 }}"}
        run: |
          AUDIO="approved/$FILE"; test -s "$AUDIO"; test "$(sha256sum "$AUDIO"|awk '{print $1}')" = "$EXPECTED_SHA"
          B=$(stat -c %s "$AUDIO"); S=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$AUDIO")
          D=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{s%3600//60:02d}:{s%60:02d}")' "$S")
          echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"; echo "bytes=$B" >> "$GITHUB_OUTPUT"; echo "duration=$D" >> "$GITHUB_OUTPUT"
      - name: Upload approved audio and update feed
        env: {SLUG: "${{ steps.req.outputs.slug }}", TITLE: "${{ steps.req.outputs.title }}", DESCRIPTION: "${{ steps.req.outputs.description }}", PREFIX: "${{ steps.req.outputs.prefix }}", AUDIO: "${{ steps.meta.outputs.audio }}", DURATION: "${{ steps.meta.outputs.duration }}"}
        run: python scripts/publish_episode.py --audio "$AUDIO" --slug "$SLUG" --title "$TITLE" --description "$DESCRIPTION" --duration "$DURATION" --prefix "$PREFIX"
      - name: Commit feed
        env: {SLUG: "${{ steps.req.outputs.slug }}", PREFIX: "${{ steps.req.outputs.prefix }}"}
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed.xml; git commit -m "Publish ${SLUG} from approved artifact [skip ci]"
          if ! git push; then python -c 'import os,boto3; from botocore.config import Config; c=boto3.client("s3",endpoint_url=os.environ["R2_ENDPOINT"].strip("\""),aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],region_name="auto",config=Config(s3={"addressing_style":"path"})); c.delete_object(Bucket=os.environ["R2_BUCKET"],Key=f"{os.environ["PREFIX"]}/{os.environ["SLUG"]}.mp3")'; exit 1; fi
