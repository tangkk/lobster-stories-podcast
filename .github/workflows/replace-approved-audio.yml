name: Replace Approved Episode Audio

on:
  push:
    branches: [main]
    paths:
      - 'publish/requests/replace-*.json'

permissions:
  contents: write
  actions: read

concurrency:
  group: podcast-feed-write
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install boto3
      - name: Resolve replacement request
        id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^publish/requests/replace-.+\.json$' | head -n 1)
          test -n "$REQUEST" || { echo 'No replacement request in triggering commit'; exit 1; }
          python -m json.tool "$REQUEST" >/dev/null
          test "$(jq -r '.operation' "$REQUEST")" = replace_audio || { echo 'operation must be replace_audio'; exit 1; }
          for key in run_id artifact_name audio_filename audio_sha256 slug prefix; do
            value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST")
            test -n "$value" || { echo "Missing replacement field: $key"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Validate existing episode and secrets
        env:
          SLUG: ${{ steps.req.outputs.slug }}
        run: |
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET; do
            test -n "${!v}" || { echo "Missing $v"; exit 1; }
          done
          grep -q "<guid[^>]*>${SLUG}</guid>" feed.xml || { echo "Episode does not exist: $SLUG"; exit 1; }
      - name: Download exact approved artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.req.outputs.artifact_name }}
          path: approved
          repository: ${{ github.repository }}
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate approved replacement audio
        id: meta
        env:
          FILE: ${{ steps.req.outputs.audio_filename }}
          EXPECTED_SHA: ${{ steps.req.outputs.audio_sha256 }}
        run: |
          AUDIO="approved/$FILE"
          test -s "$AUDIO" || { echo 'Approved replacement audio missing or empty'; exit 1; }
          ACTUAL_SHA=$(sha256sum "$AUDIO" | awk '{print $1}')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || { echo 'SHA256 mismatch'; exit 1; }
          AUDIO_BYTES=$(stat -c %s "$AUDIO")
          AUDIO_SECONDS=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$AUDIO")
          python -c 'import sys; s=float(sys.argv[1]); assert s > 1' "$AUDIO_SECONDS"
          DURATION=$(python -c 'import sys; s=round(float(sys.argv[1])); print(f"{s//3600:02d}:{(s%3600)//60:02d}:{s%60:02d}")' "$AUDIO_SECONDS")
          echo "audio=$AUDIO" >> "$GITHUB_OUTPUT"
          echo "bytes=$AUDIO_BYTES" >> "$GITHUB_OUTPUT"
          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"
      - name: Backup old object, replace audio, update local feed
        env:
          SLUG: ${{ steps.req.outputs.slug }}
          PREFIX: ${{ steps.req.outputs.prefix }}
          AUDIO: ${{ steps.meta.outputs.audio }}
          AUDIO_BYTES: ${{ steps.meta.outputs.bytes }}
          DURATION: ${{ steps.meta.outputs.duration }}
        run: |
          mkdir -p build
          python scripts/replace_episode_audio.py prepare --audio "$AUDIO" --slug "$SLUG" --prefix "$PREFIX" --bytes "$AUDIO_BYTES" --duration "$DURATION" --state build/replacement-backup.txt
      - name: Commit metadata or rollback R2 on push failure
        env:
          SLUG: ${{ steps.req.outputs.slug }}
          PREFIX: ${{ steps.req.outputs.prefix }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add feed.xml
          git commit -m "Replace audio for ${SLUG} from approved artifact [skip ci]"
          if ! git push; then
            python scripts/replace_episode_audio.py rollback --slug "$SLUG" --prefix "$PREFIX" --state build/replacement-backup.txt
            exit 1
          fi
          python scripts/replace_episode_audio.py cleanup --slug "$SLUG" --prefix "$PREFIX" --state build/replacement-backup.txt
